  <!-- Microsoft広告: このページ(申し込みフォームへの中継ページ)が開かれたら、無料体験ボタンクリックと同じコンバージョンとして計測 -->
  <script>
    window.uetq = window.uetq || [];
    window.uetq.push('event', 'trial_form_click', { 'event_category': 'trial', 'event_label': 'apply_page' });
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お申し込みフォームへ移動します｜ゆうちゃん将棋教室</title>

  <!-- このページは無料体験申し込みフォームへの中継ページです。
       GA4でボタンクリック（=申し込み意欲）をキーイベントとして計測するために設置しています。
       検索結果に表示させる必要はないため noindex にしています。 -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://yuchanshogi.com/apply.html">

  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="./images/logo.png">
  <link rel="stylesheet" href="./style.css">

  <style>
    .redirect-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .redirect-card {
      max-width: 420px;
    }
    .redirect-spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 24px;
      border: 4px solid var(--color-border);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: redirect-spin 0.8s linear infinite;
    }
    @keyframes redirect-spin {
      to { transform: rotate(360deg); }
    }
    .redirect-card p {
      color: var(--color-text-soft);
    }
    .redirect-fallback {
      margin-top: 20px;
      font-size: 0.9rem;
    }
  </style>

  <!-- 一定時間操作がなければ手動リンクへフォールバック -->
  <meta http-equiv="refresh" content="2.5; url=https://docs.google.com/forms/d/e/1FAIpQLSeoJSnN0e38d3bgUQnlUlQD2eR1Ke6zgjVOjUeUDdLPP8EvkA/viewform?usp=dialog">
</head>
<body>
  <div class="redirect-screen">
    <div class="redirect-card">
      <div class="redirect-spinner" aria-hidden="true"></div>
      <h1 style="font-size:1.3rem;">お申し込みフォームへ移動します</h1>
      <p>自動的に切り替わらない場合は、下のボタンからお進みください。</p>
      <p class="redirect-fallback">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSeoJSnN0e38d3bgUQnlUlQD2eR1Ke6zgjVOjUeUDdLPP8EvkA/viewform?usp=dialog" class="btn btn--primary">
          フォームを開く
        </a>
      </p>
    </div>
  </div>

  <!-- 申込経路の記録: 広告のクリックIDなどから流入元を判定し、Googleフォームの「経路（運営用・入力不要）」欄(entry.1359821143)に自動入力する -->
  <script>
    (function () {
      var ENTRY = 'entry.1359821143';
      var KEY = 'yc_src';
      var MAX_AGE = 30 * 24 * 60 * 60 * 1000; // 広告経由の記録は30日間保持

      function detect() {
        var p = new URLSearchParams(location.search);
        var medium = (p.get('utm_medium') || '').toLowerCase();
        var yclid = p.get('yclid') || '';
        if (yclid) {
          if (yclid.indexOf('YSS') === 0) return 'yahoo_search';
          if (yclid.indexOf('YJAD') === 0) return 'yahoo_display';
          return 'yahoo';
        }
        if (p.get('msclkid')) return medium === 'display' ? 'microsoft_display' : 'microsoft_search';
        if (p.get('gclid') || p.get('gbraid') || p.get('wbraid')) return 'google_ads';
        if (p.get('utm_source')) return (p.get('utm_source') + (medium ? '_' + medium : '')).toLowerCase();
        var ref = document.referrer || '';
        if (ref) {
          var host = '';
          try { host = new URL(ref).hostname; } catch (e) {}
          if (host === location.hostname) return '';
          if (/google\./.test(host)) return 'google_organic';
          if (/yahoo\./.test(host)) return 'yahoo_organic';
          if (/bing\./.test(host)) return 'bing_organic';
          if (/(^|\.)(x|twitter)\.com$|t\.co$/.test(host)) return 'x';
          return 'ref_' + host;
        }
        return 'direct';
      }

      var src = detect();
      var stored = null;
      try { stored = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
      if (src && src !== 'direct') {
        try { localStorage.setItem(KEY, JSON.stringify({ s: src, t: Date.now() })); } catch (e) {}
      } else if (stored && stored.s && Date.now() - stored.t < MAX_AGE) {
        src = stored.s;
      } else if (!src) {
        src = 'direct';
      }

      function withSource(url) {
        if (!url || url.indexOf('docs.google.com/forms') === -1 || url.indexOf(ENTRY + '=') !== -1) return url;
        return url + (url.indexOf('?') === -1 ? '?' : '&') + ENTRY + '=' + encodeURIComponent(src);
      }
      window.ycFormUrl = withSource;

      function rewrite() {
        var links = document.querySelectorAll('a[href*="docs.google.com/forms"]');
        for (var i = 0; i < links.length; i++) links[i].href = withSource(links[i].getAttribute('href'));
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', rewrite);
      else rewrite();
    })();
  </script>
  <script>
    // gtagの計測ビーコンが送信される時間を確保してから遷移する
    setTimeout(function () {
      var formUrl = "https://docs.google.com/forms/d/e/1FAIpQLSeoJSnN0e38d3bgUQnlUlQD2eR1Ke6zgjVOjUeUDdLPP8EvkA/viewform?usp=dialog";
      window.location.replace(window.ycFormUrl ? window.ycFormUrl(formUrl) : formUrl);
    }, 2000);
  </script>
</body>
</html>
