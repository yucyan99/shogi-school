<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YJCT517J84"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-YJCT517J84');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お申し込みフォームへ移動します｜ゆうちゃん将棋教室</title>

  <!-- このページは無料体験申し込みフォームへの中継ページです。
       GA4でボタンクリック（=申し込み意欲）をキーイベントとして計測するために設置しています。
       検索結果に表示させる必要はないため noindex にしています。 -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://yuchanshogi.com/apply.html">

  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="./images/logo.png">
  <link rel="stylesheet" href="./style.css">

  <style>
    .redirect-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .redirect-card {
      max-width: 420px;
    }
    .redirect-spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 24px;
      border: 4px solid var(--color-border);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: redirect-spin 0.8s linear infinite;
    }
    @keyframes redirect-spin {
      to { transform: rotate(360deg); }
    }
    .redirect-card p {
      color: var(--color-text-soft);
    }
    .redirect-fallback {
      margin-top: 20px;
      font-size: 0.9rem;
    }
  </style>

  <!-- 一定時間操作がなければ手動リンクへフォールバック -->
  <meta http-equiv="refresh" content="1.2; url=https://docs.google.com/forms/d/e/1FAIpQLSeoJSnN0e38d3bgUQnlUlQD2eR1Ke6zgjVOjUeUDdLPP8EvkA/viewform?usp=dialog">
</head>
<body>
  <div class="redirect-screen">
    <div class="redirect-card">
      <div class="redirect-spinner" aria-hidden="true"></div>
      <h1 style="font-size:1.3rem;">お申し込みフォームへ移動します</h1>
      <p>自動的に切り替わらない場合は、下のボタンからお進みください。</p>
      <p class="redirect-fallback">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSeoJSnN0e38d3bgUQnlUlQD2eR1Ke6zgjVOjUeUDdLPP8EvkA/viewform?usp=dialog" class="btn btn--primary">
          フォームを開く
        </a>
      </p>
    </div>
  </div>

  <script>
    // gtagの計測ビーコンが送信される時間を確保してから遷移する
    setTimeout(function () {
      window.location.replace("https://docs.google.com/forms/d/e/1FAIpQLSeoJSnN0e38d3bgUQnlUlQD2eR1Ke6zgjVOjUeUDdLPP8EvkA/viewform?usp=dialog");
    }, 900);
  </script>
</body>
</html>
