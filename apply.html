  <meta charset="UTF-8">

  <title>お申し込みフォームへ移動します｜ゆうちゃん将棋教室</title>

  <!-- このページは無料体験申し込みフォームへの中継ページです。
       GA4でボタンクリック（=申し込み意欲）をキーイベントとして計測するために設置しています。
       検索結果に表示させる必要はないため noindex にしています。 -->
  <meta name="robots" content="noindex, nofollow">

  <style>
    .redirect-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .redirect-card {
      max-width: 420px;
    }
    .redirect-spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 24px;
      border: 4px solid var(--color-border);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: redirect-spin 0.8s linear infinite;
    }
    @keyframes redirect-spin {
      to { transform: rotate(360deg); }
    }
    .redirect-card p {
      color: var(--color-text-soft);
    }
    .redirect-fallback {
      margin-top: 20px;
      font-size: 0.9rem;
    }
  </style>

  <!-- 一定時間操作がなければ手動リンクへフォールバック -->
  <meta http-equiv="refresh" content="2.5; url=https://docs.google.com/forms/d/e/1FAIpQLSeoJSnN0e38d3bgUQnlUlQD2eR1Ke6zgjVOjUeUDdLPP8EvkA/viewform?usp=dialog">
</head>
<body>
  <div class="redirect-screen">
    <div class="redirect-card">
      <div class="redirect-spinner" aria-hidden="true"></div>
      <h1 style="font-size:1.3rem;">お申し込みフォームへ移動します</h1>
      <p>自動的に切り替わらない場合は、下のボタンからお進みください。</p>
      <p class="redirect-fallback">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSeoJSnN0e38d3bgUQnlUlQD2eR1Ke6zgjVOjUeUDdLPP8EvkA/viewform?usp=dialog" class="btn btn--primary">
          フォームを開く
        </a>
      </p>
    </div>
  </div>

  <!-- 申込経路の記録: 広告のクリックIDなどから流入元を判定し、Googleフォームの「受付コード」欄(entry.1359821143)に自動入力する
       コード: Y1=Yahoo検索広告 Y2=Yahooディスプレイ広告 Y3=Yahooリターゲティング広告 Y0=Yahoo広告(種類不明)
               M1=Microsoft検索広告 M2=Microsoftディスプレイ広告 M3=Microsoftリターゲティング広告
               G1=Google広告 S1=自然検索(Google/Yahoo/Bing) R1=他サイト・SNS・utm付きリンク D1=直接(ブックマーク等) -->
  <script>
    (function () {
      var ENTRY = 'entry.1359821143';
      var KEY = 'yc_src';
      var MAX_AGE = 30 * 24 * 60 * 60 * 1000; // 経由の記録は30日間保持

      function detect() {
        var p = new URLSearchParams(location.search);
        var medium = (p.get('utm_medium') || '').toLowerCase();
        var yclid = p.get('yclid') || '';
        var yc = p.get('yc') || ''; // 広告グループのURLに付けた目印(rt=リターゲティング, disp=ディスプレイ)
        var rt = yc === 'rt';
        if (yclid) {
          if (yclid.indexOf('YSS') === 0) return 'Y1';
          if (rt) return 'Y3';
          if (yclid.indexOf('YJAD') === 0) return 'Y2';
          return 'Y0';
        }
        if (p.get('msclkid')) return rt ? 'M3' : (yc === 'disp' || medium === 'display' ? 'M2' : 'M1');
        if (p.get('gclid') || p.get('gbraid') || p.get('wbraid')) return 'G1';
        if (p.get('utm_source')) return 'R1';
        var ref = document.referrer || '';
        if (ref) {
          var host = '';
          try { host = new URL(ref).hostname; } catch (e) {}
          if (host === location.hostname) return '';
          if (/(google|yahoo|bing)\./.test(host)) return 'S1';
          return 'R1';
        }
        return 'D1';
      }

      // 経由した流入元を古い順に記録し、「Y2>S1>Y1」のように > でつないでフォームに入れる
      // (左端=最初のきっかけ、右端=申込み直前の流入元。直接訪問(D1)は記録しない。最大5件、30日で消える)
      var MAX_LEN = 5;
      var now = Date.now();
      var hist = [];
      try { hist = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) {}
      if (hist && !(hist instanceof Array) && hist.s) hist = [hist]; // 旧形式(1件のみ)からの移行
      if (!(hist instanceof Array)) hist = [];
      hist = hist.filter(function (h) { return h && /^[A-Z][0-9]$/.test(h.s) && now - h.t < MAX_AGE; });
      var cur = detect();
      if (cur && cur !== 'D1') {
        if (!hist.length || hist[hist.length - 1].s !== cur) hist.push({ s: cur, t: now });
        else hist[hist.length - 1].t = now;
        if (hist.length > MAX_LEN) hist = [hist[0]].concat(hist.slice(hist.length - (MAX_LEN - 1)));
        try { localStorage.setItem(KEY, JSON.stringify(hist)); } catch (e) {}
      }
      var src = hist.length ? hist.map(function (h) { return h.s; }).join('>') : 'D1';

      function withSource(url) {
        if (!url || url.indexOf('docs.google.com/forms') === -1 || url.indexOf(ENTRY + '=') !== -1) return url;
        return url + (url.indexOf('?') === -1 ? '?' : '&') + ENTRY + '=' + encodeURIComponent(src);
      }
      window.ycFormUrl = withSource;

      function rewrite() {
        var links = document.querySelectorAll('a[href*="docs.google.com/forms"]');
        for (var i = 0; i < links.length; i++) links[i].href = withSource(links[i].getAttribute('href'));
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', rewrite);
      else rewrite();
    })();
  </script>
  <script>
    // gtagの計測ビーコンが送信される時間を確保してから遷移する
    setTimeout(function () {
      var formUrl = "https://docs.google.com/forms/d/e/1FAIpQLSeoJSnN0e38d3bgUQnlUlQD2eR1Ke6zgjVOjUeUDdLPP8EvkA/viewform?usp=dialog";
      window.location.replace(window.ycFormUrl ? window.ycFormUrl(formUrl) : formUrl);
    }, 2000);
  </script>
</body>
